# ---------------------------------------------------------------------------
# Nginx Proxy Manager → Wazuh Dashboard (OpenSearch Dashboard)
# Вставьте блок в Proxy Host → вкладка Advanced → Custom Nginx Configuration.
# Схема бэкенда в NPM должна быть HTTPS (Dashboard слушает TLS на хосте).
# Upstream: IP машины с Docker и порт из WazuhCentral/.env → DASHBOARD_HTTPS_PORT.
# ---------------------------------------------------------------------------

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
send_timeout 300s;

# Бэкенд (Wazuh Dashboard) использует самоподписанный сертификат.
proxy_ssl_server_name on;
proxy_ssl_verify off;

# WebSockets: включите переключатель «WebSockets» в UI этого Proxy Host в NPM
# (дублировать заголовки Upgrade/Connection здесь обычно не нужно).
