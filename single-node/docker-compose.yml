# Copy .env.example to .env to override defaults (docker compose loads .env automatically).
services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_STACK_VERSION:-5.0.0-beta1-latest}
    hostname: wazuh.manager
    container_name: single-node-wazuh.manager
    restart: always
    depends_on:
      wazuh.indexer:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", "curl -k -s -o /dev/null https://localhost:55000 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    # High nofile (e.g. 655360) is rejected on Docker-in-LXC; override on bare metal if needed.
    ulimits:
      nofile:
        soft: ${WAZUH_MANAGER_NOFILE_SOFT:-65536}
        hard: ${WAZUH_MANAGER_NOFILE_HARD:-65536}
    ports:
      - "${WAZUH_AGENT_PORT:-1514}:1514"
      - "${WAZUH_REGISTRATION_PORT:-1515}:1515"
      - "${WAZUH_SYSLOG_UDP_PORT:-514}:514/udp"
      - "${WAZUH_API_PORT:-55000}:55000"
    environment:
      - WAZUH_INDEXER_HOSTS=wazuh.indexer:9200
      - WAZUH_NODE_NAME=manager
      - WAZUH_CLUSTER_NODES=wazuh.manager
      - WAZUH_CLUSTER_BIND_ADDR=wazuh.manager
      - INDEXER_USERNAME=${INDEXER_USERNAME:-admin}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-admin}
    volumes:
      - wazuh_api_configuration:/var/wazuh-manager/api/configuration
      - wazuh_etc:/var/wazuh-manager/etc
      - wazuh_logs:/var/wazuh-manager/logs
      - wazuh_queue:/var/wazuh-manager/queue
      - wazuh_var_multigroups:/var/wazuh-manager/var/multigroups
      - ./config/wazuh_manager/certs/root-ca.pem:/var/wazuh-manager/etc/certs/root-ca.pem
      - ./config/wazuh_manager/certs/wazuh.manager.pem:/var/wazuh-manager/etc/certs/manager.pem
      - ./config/wazuh_manager/certs/wazuh.manager-key.pem:/var/wazuh-manager/etc/certs/manager-key.pem

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_STACK_VERSION:-5.0.0-beta1-latest}
    hostname: wazuh.indexer
    container_name: single-node-wazuh.indexer
    restart: always
    ports:
      - "${WAZUH_INDEXER_PORT:-9200}:9200"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms${INDEXER_JAVA_HEAP:-1g} -Xmx${INDEXER_JAVA_HEAP:-1g}
      # Heap mlock requires permissive memlock ulimits; disabled for restricted hosts (e.g. LXC).
      - bootstrap.memory_lock=false
      - network.host=0.0.0.0
      - node.name=wazuh.indexer
      - cluster.initial_cluster_manager_nodes=wazuh.indexer
      - node.max_local_storage_nodes=1
      - plugins.security.allow_default_init_securityindex=true
      - NODES_DN=CN=wazuh.indexer,OU=Wazuh,O=Wazuh,L=California,C=US
      # Same creds as manager/dashboard; required so healthcheck can curl without embedding shell-metacharacters from .env.
      - INDEXER_USERNAME=${INDEXER_USERNAME:-admin}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-admin}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # Use $$ so Compose emits ${VAR} for the container shell — passwords with & > etc. stay safe inside quoted expansion.
      test: ["CMD-SHELL", "curl -fsSk -u \"$${INDEXER_USERNAME}:$${INDEXER_PASSWORD}\" https://127.0.0.1:9200/_cluster/health | grep -qE '\"status\"[[:space:]]*:[[:space:]]*\"(green|yellow|red)\"'"]
      interval: 30s
      timeout: 15s
      retries: 12
      start_period: 240s
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/indexer-key.pem
      - ./config/wazuh_indexer/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/indexer.pem
      - ./config/wazuh_indexer/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_STACK_VERSION:-5.0.0-beta1-latest}
    hostname: wazuh.dashboard
    container_name: single-node-wazuh.dashboard
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-k", "-s", "-o", "/dev/null", "https://localhost:5601/login" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "${WAZUH_DASHBOARD_PORT:-443}:5601"
    environment:
      - SERVER_PORT=5601
      - SERVER_HOST=0.0.0.0
      - OPENSEARCH_HOSTS=https://wazuh.indexer:9200
      - INDEXER_USERNAME=${INDEXER_USERNAME:-admin}
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:-admin}
      # Browser reaches API at WAZUH_API_URL:API_PORT — use public host/IP when not opening UI from Docker LAN.
      - WAZUH_API_URL=${WAZUH_API_URL:-https://wazuh.manager}
      - API_PORT=${WAZUH_API_PORT:-55000}
      - DASHBOARD_USERNAME=${DASHBOARD_USERNAME:-kibanaserver}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-kibanaserver}
      - SERVER_SSL_CERTIFICATE=/usr/share/wazuh-dashboard/config/certs/dashboard.pem
      - SERVER_SSL_KEY=/usr/share/wazuh-dashboard/config/certs/dashboard-key.pem
      - OPENSEARCH_SSL_CERTIFICATE_AUTHORITIES=/usr/share/wazuh-dashboard/config/certs/root-ca.pem
    volumes:
      - ./config/wazuh_dashboard/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/config/certs/dashboard.pem
      - ./config/wazuh_dashboard/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/config/certs/dashboard-key.pem
      - ./config/wazuh_dashboard/certs/root-ca.pem:/usr/share/wazuh-dashboard/config/certs/root-ca.pem
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    # Wait until indexer passes healthcheck so migrations do not race against ECONNREFUSED / partial .kibana_1.
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_started

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
